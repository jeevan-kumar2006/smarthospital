<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{% block title %}Smart HMS{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/static/style.css" rel="stylesheet">
</head>
<body>
<button class="mobile-toggle"><i class="bi bi-list"></i></button>
<aside class="sidebar">
  <div class="sidebar-brand"><h4><i class="bi bi-hospital me-2"></i>Smart HMS</h4><small>DBMS Project</small></div>
  <nav class="sidebar-nav">
    <div class="ns">Overview</div>
    <a href="/" class="nav-link"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <div class="ns">Management</div>
    <a href="/patients/" class="nav-link"><i class="bi bi-people"></i> Patients</a>
    <a href="/doctors/" class="nav-link"><i class="bi bi-person-badge"></i> Doctors</a>
    <a href="/appointments/" class="nav-link"><i class="bi bi-calendar-check"></i> Appointments</a>
    <a href="/treatments/" class="nav-link"><i class="bi bi-clipboard2-pulse"></i> Treatments</a>
    <a href="/medicines/" class="nav-link"><i class="bi bi-capsule"></i> Medicines</a>
    <a href="/billing/" class="nav-link"><i class="bi bi-receipt"></i> Billing</a>
    <div class="ns">Analytics</div>
    <a href="/reports/" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reports</a>
    <a href="/sql-demo/" class="nav-link"><i class="bi bi-code-slash"></i> SQL Demo</a>
    <div class="ns">Quick Search</div>
    <div class="px-3 pb-2 position-relative">
      <input type="text" id="psi" class="form-control fc form-control-sm" placeholder="Search patients..." style="background:#16213e;border-color:#2a2a3e;color:#fff;font-size:12px">
      <div id="psr" class="dropdown-menu show" style="position:absolute;top:100%;left:0;right:0;z-index:10;max-height:250px;overflow-y:auto;background:#fff;border:1px solid #d1d5db;border-radius:6px;display:none"></div>
    </div>
  </nav>
</aside>
<main class="main-content">{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
